name: Quality assurance

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  tests:
    strategy:
      matrix:
        php: [ '8.2','8.3','8.4','8.5' ]
    runs-on: ubuntu-latest
    steps:

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          coverage: xdebug
          tools: phing:v3

      - uses: actions/checkout@v2

      - name: Install dependencies
        run: phing composer:install

      - name: lint php
        run: phing php:lint

      - name: validate composer
        run: phing composer:validate

      - name: php-cs-fixer
        run: phing cs:check

      - name: PHPUnit
        run: phing phpunit:check

      - name: behat
        run: phing behat:check

      - name: phpstan
        run: phing phpstan:check
